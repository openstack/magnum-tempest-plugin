[build-system]
requires = ["pbr>=6.1.1"]
build-backend = "pbr.build"

[project]
name = "magnum_tempest_plugin"
description = "Tempest plugin for Magnum"
authors = [
    {name = "OpenStack", email = "openstack-discuss@lists.openstack.org"},
]
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "Apache-2.0"
dynamic = ["version", "dependencies"]
requires-python = ">=3.11"
classifiers = [
    "Environment :: OpenStack",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://opendev.org/openstack/magnum-tempest-plugin"

[project.entry-points."tempest.test_plugins"]
magnum_tests = "magnum_tempest_plugin.plugin:MagnumTempestPlugin"

[tool.setuptools.packages.find]
include = ["magnum_tempest_plugin"]
